<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ダッシュボード</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ダッシュボード">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- タッチイベント用 Hammer.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- 1. 今日の天気 -->
    <section class="card" id="weather-section">
      <div class="section-header">
        <h2>天気</h2>
        <div class="action-buttons">
          <button id="add-weather-btn" class="btn primary">追加</button>
          <button id="del-weather-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="weather-tabs" class="tab-container horizontal-scroll" style="margin-bottom: 8px;"></div>
      <div id="weather-container" class="horizontal-scroll">
        <div class="loading">天気データを読み込み中...</div>
      </div>
    </section>

    <!-- 2. 今日のニュース -->
    <section class="card" id="news-section">
      <div class="section-header">
        <h2>ニュース</h2>
        <div class="action-buttons">
          <!-- ニュースカードの追加ボタンの左側に指定アイコンを表示 -->
          <button id="news-video-player-btn" class="btn icon-btn" title="ショート動画で視聴" style="padding: 2px 6px; background: transparent; border: none; cursor: pointer;">
            <img src="icons/video-play.png" alt="動画再生" style="width: 24px; height: 24px; vertical-align: middle;">
          </button>
          <button id="add-news-btn" class="btn primary">追加</button>
          <button id="del-news-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="news-tabs" class="tab-container horizontal-scroll"></div>
      <div id="news-content" class="vertical-scroll">
        <div class="loading">ニュースを選択してください</div>
      </div>
    </section>

    <!-- 3. 知識 -->
    <section class="card" id="knowledge-section">
      <div class="section-header">
        <h2>知識</h2>
        <div class="action-buttons">
          <!-- 知識カードの追加ボタンの左側に指定アイコンを表示（必要に応じて画像パスを変更してください） -->
          <button id="knowledge-video-player-btn" class="btn icon-btn" title="知識ショート動画" style="padding: 2px 6px; background: transparent; border: none; cursor: pointer;">
            <img src="icons/video-play.png" alt="知識動画" style="width: 24px; height: 24px; vertical-align: middle;">
          </button>
          <button id="add-knowledge-btn" class="btn primary">追加</button>
          <button id="del-knowledge-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="knowledge-tabs" class="tab-container horizontal-scroll"></div>
      <div id="knowledge-content" class="vertical-scroll">
        <div class="loading">知識データを選択してください</div>
      </div>
    </section>

    <!-- 4. Twitter -->
    <section class="card" id="twitter-section">
      <div class="section-header">
        <h2>Twitter</h2>
        <div class="action-buttons">
          <button id="add-twitter-btn" class="btn primary">追加</button>
          <button id="del-twitter-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="twitter-tabs" class="tab-container horizontal-scroll" style="margin-bottom: 8px;"></div>
      <div id="twitter-content" class="vertical-scroll">
        <div class="loading">Twitterデータを読み込み中...</div>
      </div>
    </section>

    <!-- 5. YouTube -->
    <section class="card" id="youtube-section">
      <div class="section-header">
        <h2>YouTube</h2>
        <div class="action-buttons">
          <button id="add-youtube-btn" class="btn primary">追加</button>
          <button id="del-youtube-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="youtube-tabs" class="tab-container horizontal-scroll" style="margin-bottom: 8px;"></div>
      <div id="youtube-content" class="vertical-scroll">
        <div class="loading">配信先を追加してください。</div>
      </div>
    </section>
  </main>

  <!-- 汎用モーダルダイアログ -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">項目を追加</h3>
      </div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn">キャンセル</button>
        <button id="modal-submit-btn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- TikTok風 ショート動画プレイヤー モーダル -->
  <div id="shorts-modal" class="shorts-modal hidden">
    <button id="shorts-close-btn" class="shorts-close-btn">×</button>
    <div id="shorts-container" class="shorts-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
