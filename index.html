<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ダッシュボード</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ダッシュボード">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- 1. 今日の天気 -->
    <section class="card" id="weather-section">
      <div class="section-header">
        <h2>天気</h2>
        <div class="action-buttons">
          <button id="add-weather-btn" class="btn primary">追加</button>
          <button id="del-weather-btn" class="btn warning">編集</button>
          <button id="refresh-weather-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="weather-container" class="horizontal-scroll">
        <div class="loading">天気データを読み込み中...</div>
      </div>
    </section>

    <!-- 2. 今日のニュース -->
    <section class="card" id="news-section">
      <div class="section-header">
        <h2>ニュース</h2>
        <div class="action-buttons">
          <button id="add-news-btn" class="btn primary">追加</button>
          <button id="del-news-btn" class="btn warning">編集</button>
          <button id="refresh-news-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="news-tabs" class="tab-container horizontal-scroll"></div>
      <div id="news-content" class="vertical-scroll">
        <div class="loading">ニュースを選択してください</div>
      </div>
    </section>

    <!-- 3. 知識 -->
    <section class="card" id="knowledge-section">
      <div class="section-header">
        <h2>知識</h2>
        <div class="action-buttons">
          <button id="add-knowledge-btn" class="btn primary">追加</button>
          <button id="del-knowledge-btn" class="btn warning">編集</button>
          <button id="refresh-knowledge-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="knowledge-tabs" class="tab-container horizontal-scroll"></div>
      <div id="knowledge-content" class="vertical-scroll">
        <div class="loading">知識データを選択してください</div>
      </div>
    </section>

    <!-- 4. Twitter -->
    <section class="card" id="twitter-section">
      <div class="section-header">
        <h2>Twitter</h2>
        <div class="action-buttons">
          <button id="add-twitter-btn" class="btn primary">追加</button>
          <button id="del-twitter-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="twitter-content" class="vertical-scroll">
        <!-- app.js 内でここにコンテンツが生成されます -->
      </div>
    </section>

    <!-- 5. YouTube -->
    <section class="card" id="youtube-section">
      <div class="section-header youtube-section-header">
        <div class="youtube-header-top">
          <h2>YouTube</h2>
          <div class="action-buttons">
            <button id="add-youtube-btn" class="btn primary">追加</button>
            <button id="del-youtube-btn" class="btn warning">編集</button>
          </div>
        </div>
        <div id="youtube-controls-host" class="youtube-controls-host"></div>
      </div>
      <div id="youtube-content" class="vertical-scroll youtube-scroll-area">
        <div class="loading">配信先を追加してください。</div>
      </div>
    </section>

    <!-- 6. Twitch -->
    <section class="card" id="twitch-section">
      <div class="section-header">
        <h2>Twitch</h2>
        <div class="action-buttons">
          <button id="add-twitch-btn" class="btn primary">追加</button>
          <button id="del-twitch-btn" class="btn warning">編集</button>
          <button id="refresh-twitch-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="twitch-tabs" class="tab-container horizontal-scroll"></div>
      <div id="twitch-live-slot" class="twitch-live-slot" aria-live="polite"></div>
      <div id="twitch-content" class="vertical-scroll twitch-scroll-area">
        <div class="loading">配信者を追加してください。</div>
      </div>
    </section>
  </main>


  <!-- AIニュース要約：全画面オーバーレイ -->
  <div id="summary-overlay" class="summary-overlay hidden" aria-hidden="true">
    <div class="summary-topbar">
      <button id="summary-close-btn" class="summary-close-btn summary-no-swipe" type="button" aria-label="要約を閉じる">✕</button>
      <div class="summary-topbar-title">AI要約</div>
      <div id="summary-position" class="summary-position" aria-live="polite"></div>
    </div>

    <div id="summary-swiper" class="swiper summary-swiper">
      <div id="summary-swiper-wrapper" class="swiper-wrapper"></div>
    </div>

    <form id="summary-chat-form" class="summary-chat-form summary-no-swipe">
      <input
        id="summary-chat-input"
        class="summary-chat-input"
        type="text"
        placeholder="この記事についてAIに質問"
        autocomplete="off"
        enterkeyhint="send"
        aria-label="AIへの質問"
      >
      <button id="summary-chat-send" class="summary-chat-send" type="submit">送信</button>
    </form>
  </div>

  <!-- 汎用モーダルダイアログ -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">項目を追加</h3>
      </div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn">キャンセル</button>
        <button id="modal-submit-btn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ニュース/知識の左右スワイプ + 要約オーバーレイの上下スワイプ -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
