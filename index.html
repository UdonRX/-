<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ダッシュボード</title>

  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ダッシュボード">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- 1. 今日の天気 -->
    <section class="card" id="weather-section">
      <div class="section-header">
        <h2>天気</h2>
        <div class="action-buttons">
          <button id="add-weather-btn" class="btn primary">追加</button>
          <button id="del-weather-btn" class="btn warning">編集</button>
          <button id="refresh-weather-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="weather-container" class="horizontal-scroll">
        <div class="loading">天気データを読み込み中...</div>
      </div>
    </section>

    <!-- 2. 今日のニュース -->
    <section class="card" id="news-section">
      <div class="section-header">
        <h2>ニュース</h2>
        <div class="action-buttons">
          <button id="add-news-btn" class="btn primary">追加</button>
          <button id="del-news-btn" class="btn warning">編集</button>
          <button id="refresh-news-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="news-tabs" class="tab-container horizontal-scroll"></div>
      <div id="news-content" class="vertical-scroll">
        <div class="loading">ニュースを選択してください</div>
      </div>
    </section>

    <!-- 3. 知識 -->
    <section class="card" id="knowledge-section">
      <div class="section-header">
        <h2>知識</h2>
        <div class="action-buttons">
          <button id="add-knowledge-btn" class="btn primary">追加</button>
          <button id="del-knowledge-btn" class="btn warning">編集</button>
          <button id="refresh-knowledge-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="knowledge-tabs" class="tab-container horizontal-scroll"></div>
      <div id="knowledge-content" class="vertical-scroll">
        <div class="loading">知識データを選択してください</div>
      </div>
    </section>

    <!-- 4. Twitter -->
    <section class="card" id="twitter-section">
      <div class="section-header">
        <h2>Twitter</h2>
        <div class="action-buttons">
          <button id="add-twitter-btn" class="btn primary">追加</button>
          <button id="del-twitter-btn" class="btn warning">編集</button>
        </div>
      </div>
      <div id="twitter-content" class="vertical-scroll">
        <!-- app.js 内でここにコンテンツが生成されます -->
      </div>
    </section>

    <!-- 5. YouTube -->
    <section class="card" id="youtube-section">
      <div class="section-header youtube-section-header">
        <div class="youtube-header-top">
          <h2>YouTube</h2>
          <div class="action-buttons">
            <button id="add-youtube-btn" class="btn primary">追加</button>
            <button id="del-youtube-btn" class="btn warning">編集</button>
          </div>
        </div>
        <div id="youtube-controls-host" class="youtube-controls-host"></div>
      </div>
      <div id="youtube-content" class="vertical-scroll youtube-scroll-area">
        <div class="loading">配信先を追加してください。</div>
      </div>
    </section>

    <!-- 6. Twitch -->
    <section class="card" id="twitch-section">
      <div class="section-header">
        <h2>Twitch</h2>
        <div class="action-buttons">
          <button id="add-twitch-btn" class="btn primary">追加</button>
          <button id="del-twitch-btn" class="btn warning">編集</button>
          <button id="refresh-twitch-btn" class="btn refresh">更新</button>
        </div>
      </div>
      <div id="twitch-tabs" class="tab-container horizontal-scroll"></div>
      <div id="twitch-live-slot" class="twitch-live-slot" aria-live="polite"></div>
      <div id="twitch-content" class="vertical-scroll twitch-scroll-area">
        <div class="loading">配信者を追加してください。</div>
      </div>
    </section>

    <!-- 7. 新アプリへ引き継ぎ -->
    <section class="card" id="data-migration-section">
      <div class="section-header">
        <h2>新アプリへ引き継ぎ</h2>
        <div class="action-buttons">
          <button id="export-v2-settings-btn" class="btn primary" type="button">
            設定を書き出す
          </button>
        </div>
      </div>
      <div style="font-size:13px; line-height:1.6; color:var(--text-sub);">
        新しいWebアプリの「設定 → 設定を読み込む」で使えるJSONを保存します。
      </div>
      <div id="export-v2-status"
           style="margin-top:8px; font-size:12px; line-height:1.5; color:var(--text-sub);">
        準備完了
      </div>
    </section>
  </main>


  <!-- AIニュース要約：全画面オーバーレイ -->
  <div id="summary-overlay" class="summary-overlay hidden" aria-hidden="true">
    <div class="summary-topbar">
      <button id="summary-close-btn" class="summary-close-btn summary-no-swipe" type="button" aria-label="要約を閉じる">✕</button>
      <div class="summary-topbar-title">AI要約</div>
      <div id="summary-position" class="summary-position" aria-live="polite"></div>
    </div>

    <div id="summary-swiper" class="swiper summary-swiper">
      <div id="summary-swiper-wrapper" class="swiper-wrapper"></div>
    </div>

    <form id="summary-chat-form" class="summary-chat-form summary-no-swipe">
      <input
        id="summary-chat-input"
        class="summary-chat-input"
        type="text"
        placeholder="この記事についてAIに質問"
        autocomplete="off"
        enterkeyhint="send"
        aria-label="AIへの質問"
      >
      <button id="summary-chat-send" class="summary-chat-send" type="submit">送信</button>
    </form>
  </div>

  <!-- 汎用モーダルダイアログ -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">項目を追加</h3>
      </div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn">キャンセル</button>
        <button id="modal-submit-btn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ニュース/知識の左右スワイプ + 要約オーバーレイの上下スワイプ -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="app.js"></script>


  <!-- 旧アプリ → Dashboard V2 設定移行（インライン版 / iPhone対応） -->

(() => {
  'use strict';

  ];

  };

  const PREF_JMA_CODES = {
    '青森県':'020000','岩手県':'030000','宮城県':'040000','秋田県':'050000',
    '山形県':'060000','福島県':'070000','茨城県':'080000','栃木県':'090000',
    '群馬県':'100000','埼玉県':'110000','千葉県':'120000','東京都':'130000',
    '神奈川県':'140000','新潟県':'150000','富山県':'160000','石川県':'170000',
    '福井県':'180000','山梨県':'190000','長野県':'200000','岐阜県':'210000',
    '静岡県':'220000','愛知県':'230000','三重県':'240000','滋賀県':'250000',
    '京都府':'260000','大阪府':'270000','兵庫県':'280000','奈良県':'290000',

    '広島県':'340000','山口県':'350000','徳島県':'360000','香川県':'370000',
    '愛媛県':'380000','高知県':'390000','福岡県':'400000','佐賀県':'410000',

    '011000':[45.4157,141.6731],
    '012000':[43.7706,142.3650],
    '013000':[44.0206,144.2735],
    '014100':[42.9849,144.3810],

    '017000':[41.7687,140.7288],
    '020000':PREF_COORDS['青森県'],
    '030000':PREF_COORDS['岩手県'],
    '040000':PREF_COORDS['宮城県'],
    '050000':PREF_COORDS['秋田県'],
    '060000':PREF_COORDS['山形県'],
    '070000':PREF_COORDS['福島県'],
    '080000':PREF_COORDS['茨城県'],
    '090000':PREF_COORDS['栃木県'],
    '100000':PREF_COORDS['群馬県'],
    '110000':PREF_COORDS['埼玉県'],
    '120000':PREF_COORDS['千葉県'],
    '130000':PREF_COORDS['東京都'],
    '140000':PREF_COORDS['神奈川県'],
    '150000':PREF_COORDS['新潟県'],
    '160000':PREF_COORDS['富山県'],
    '170000':PREF_COORDS['石川県'],
    '180000':PREF_COORDS['福井県'],
    '190000':PREF_COORDS['山梨県'],
    '200000':PREF_COORDS['長野県'],
    '210000':PREF_COORDS['岐阜県'],
    '220000':PREF_COORDS['静岡県'],
    '230000':PREF_COORDS['愛知県'],
    '240000':PREF_COORDS['三重県'],
    '250000':PREF_COORDS['滋賀県'],
    '260000':PREF_COORDS['京都府'],
    '270000':PREF_COORDS['大阪府'],
    '280000':PREF_COORDS['兵庫県'],
    '290000':PREF_COORDS['奈良県'],
    '300000':PREF_COORDS['和歌山県'],
    '310000':PREF_COORDS['鳥取県'],
    '320000':PREF_COORDS['島根県'],
    '330000':PREF_COORDS['岡山県'],
    '340000':PREF_COORDS['広島県'],
    '350000':PREF_COORDS['山口県'],
    '360000':PREF_COORDS['徳島県'],
    '370000':PREF_COORDS['香川県'],
    '380000':PREF_COORDS['愛媛県'],
    '390000':PREF_COORDS['高知県'],
    '400000':PREF_COORDS['福岡県'],
    '410000':PREF_COORDS['佐賀県'],
    '420000':PREF_COORDS['長崎県'],
    '430000':PREF_COORDS['熊本県'],
    '440000':PREF_COORDS['大分県'],
    '450000':PREF_COORDS['宮崎県'],
    '460100':PREF_COORDS['鹿児島県'],
    '471000':[26.2124,127.6809],
    '472000':[25.8280,131.2320],
    '473000':[24.8055,125.2811],
    '474000':[24.3448,124.1572]
  };

  function cloneFallback(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function readArray(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return cloneFallback(fallback);
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : cloneFallback(fallback);
    } catch (err) {
      console.warn(`[migration] ${key} を読めなかったため初期値を使用します`, err);
      return cloneFallback(fallback);
    }
  }

  function normalizeJmaCode(value) {
    const raw = String(value ?? '').trim();
    if (!raw) return '';
    if (!/^\d+$/.test(raw)) return raw;
    return raw.length < 6 ? raw.padStart(6, '0') : raw;
  }

  function dedupeFeeds(feeds) {
    const seen = new Set();
    return (Array.isArray(feeds) ? feeds : [])
      .map(feed => ({
        name: String(feed?.name || '').trim(),
        url: String(feed?.url || '').trim()
      }))
      .filter(feed => {
        if (!feed.url) return false;
        const key = feed.url;
        if (seen.has(key)) return false;
        seen.add(key);
        if (!feed.name) feed.name = feed.url;
        return true;
      });
  }

  function migrateWeatherLocation(location) {
    const name = String(location?.name || '').trim();
    let jmaCode = normalizeJmaCode(
      location?.jmaCode ||
      location?.code ||
      PREF_JMA_CODES[name] ||
      ''
    );

    // 北海道・沖縄の旧データで都道府県名だけ残っている場合の既定値。
    if (!jmaCode && name === '北海道') jmaCode = '016000';
    if (!jmaCode && name === '沖縄県') jmaCode = '471000';

    let lat = Number(location?.lat);
    let lon = Number(location?.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      const coords = CODE_COORDS[jmaCode] || PREF_COORDS[name];
      if (!coords) {
        throw new Error(
          `天気の地域「${name || '名称不明'}」を新アプリ用へ変換できませんでした。` +
          `旧アプリの天気設定を一度編集・保存してから、もう一度書き出してください。`
        );
      }
      [lat, lon] = coords;
    }

    if (!jmaCode) {
      throw new Error(`天気の地域「${name || '名称不明'}」の気象庁コードが見つかりませんでした。`);
    }

    return {
      name: name || '登録地域',
      jmaCode,
      lat,
      lon
    };
  }

  function migrateTwitterFeed(feed) {
    const name = String(feed?.name || '').trim() || 'Twitter / X';
    const raw = String(feed?.id || feed?.url || '').trim();
    if (!raw) return null;

    if (/^https?:\/\//i.test(raw) || raw.startsWith('/')) {
      return { name, url: raw };
    }

    return { name, id: raw };
  }

  function migrateNamedValue(feed) {
    const value = String(feed?.value || feed?.url || '').trim();
    if (!value) return null;
    const name = String(feed?.name || '').trim();
    return { name, value };
  }

  function buildPayload() {
    const oldWeather = readArray('weatherLocations', LEGACY_DEFAULTS.weatherLocations);
    const oldNews = readArray('newsFeeds', LEGACY_DEFAULTS.newsFeeds);
    const oldKnowledge = readArray('knowledgeFeeds', LEGACY_DEFAULTS.knowledgeFeeds);
    const oldYoutube = readArray('youtubeFeeds', LEGACY_DEFAULTS.youtubeFeeds);
    const oldTwitch = readArray('twitchFeeds', LEGACY_DEFAULTS.twitchFeeds);
    const oldTwitter = readArray('twitterFeeds', LEGACY_DEFAULTS.twitterFeeds);

    const paperFeeds = dedupeFeeds(
      oldNews
        .filter(feed => /\/api\/papers-feed(?:\?|$)/i.test(String(feed?.url || '')))
        .map(feed => ({
          name: String(feed?.name || '論文').trim() || '論文',
          url: String(feed?.url || '/api/papers-feed').trim()
        }))
    );

    const newsFeeds = dedupeFeeds(
      oldNews.filter(feed => !/\/api\/papers-feed(?:\?|$)/i.test(String(feed?.url || '')))
    );

    const knowledgeFeeds = dedupeFeeds([
      ...V2_KNOWLEDGE_DEFAULTS,
      ...oldKnowledge
    ]);

    const youtubeChannels = oldYoutube
      .map(migrateNamedValue)
      .filter(Boolean);

    const twitchChannels = oldTwitch
      .map(migrateNamedValue)
      .filter(Boolean);

    const twitterFeeds = oldTwitter
      .map(migrateTwitterFeed)
      .filter(Boolean);

    return {
      version: 2,
      exportedAt: new Date().toISOString(),
      source: 'legacy-personal-dashboard',
      values: {
        weatherLocations: oldWeather.map(migrateWeatherLocation),
        newsFeeds,
        knowledgeFeeds,
        paperFeeds: paperFeeds.length
          ? paperFeeds
          : [{ name: '論文', url: '/api/papers-feed' }],
        youtubeChannels,
        twitchChannels,
        twitterFeeds
      }
    };
  }

  function setExportStatus(message) {
    const el = document.getElementById('export-v2-status');
    if (el) el.textContent = message;
  }

  async function downloadPayload() {
    setExportStatus('設定データを変換中…');

    const payload = buildPayload();
    const json = JSON.stringify(payload, null, 2);
    const filename = `dashboard-v2-settings-from-old-${new Date().toISOString().slice(0, 10)}.json`;

    // iPhone / iPad Safari・ホーム画面PWAでは
    // Web Share API のファイル共有が最も確実。
    try {
      const file = new File(
        [json],
        filename,
        { type: 'application/json' }
      );

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        setExportStatus('共有画面を開いています…');

        await navigator.share({
          files: [file],
          title: 'Dashboard V2 設定',
          text: '新しいWebアプリへ読み込む設定ファイルです。'
        });

        setExportStatus('書き出し完了。「ファイルに保存」したJSONを新アプリで読み込んでください。');
        return;
      }
    } catch (err) {
      // ユーザーが共有シートを閉じた場合は終了。
      if (err && err.name === 'AbortError') {
        setExportStatus('書き出しをキャンセルしました。');
        return;
      }
      console.warn('[migration-export] Web Share failed; fallback to download.', err);
    }

    // 通常ブラウザ向けフォールバック
    try {
      const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      const objectUrl = URL.createObjectURL(blob);
      const anchor = document.createElement('a');

      anchor.href = objectUrl;
      anchor.download = filename;
      anchor.rel = 'noopener';
      anchor.style.display = 'none';

      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => URL.revokeObjectURL(objectUrl), 10000);
      setExportStatus('書き出し完了。ダウンロードしたJSONを新アプリで読み込んでください。');

      alert(
        '設定JSONを書き出しました。\n\n' +
        '新しいWebアプリで\n' +
        '「設定 → 設定を読み込む」\n' +
        'を開き、保存したJSONを選んでください。'
      );
      return;
    } catch (err) {
      console.error('[migration-export] Download fallback failed.', err);
    }

    // 最終フォールバック：JSONを画面に表示してコピー可能にする
    setExportStatus('自動保存できなかったため、JSONを画面に表示します。');

    const overlay = document.createElement('div');
    overlay.style.cssText =
      'position:fixed;inset:0;z-index:999999;background:#fff;padding:16px;' +
      'padding-top:max(16px,env(safe-area-inset-top));overflow:auto;color:#111;';

    const title = document.createElement('h2');
    title.textContent = '設定JSON';
    title.style.margin = '0 0 12px';

    const note = document.createElement('p');
    note.textContent = '下の内容をコピーして .json ファイルとして保存してください。';
    note.style.fontSize = '13px';

    const textarea = document.createElement('textarea');
    textarea.value = json;
    textarea.readOnly = true;
    textarea.style.cssText =
      'box-sizing:border-box;width:100%;height:65vh;font-size:12px;' +
      'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;';

    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '閉じる';
    close.className = 'btn primary';
    close.style.marginTop = '12px';
    close.addEventListener('click', () => overlay.remove());

    overlay.append(title, note, textarea, close);
    document.body.appendChild(overlay);
    textarea.focus();
    textarea.select();
  }

  function init() {
    const button = document.getElementById('export-v2-settings-btn');
    if (!button || button.dataset.migrationExportBound === '1') return;

    button.dataset.migrationExportBound = '1';
    setExportStatus('準備完了');

    button.addEventListener('click', async () => {
      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = '書き出し中…';

      try {
        await downloadPayload();
      } catch (err) {
        console.error('[migration-export]', err);
        setExportStatus('エラー: ' + (err?.message || '設定の書き出しに失敗しました。'));
        alert(err?.message || '設定の書き出しに失敗しました。');
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    });
  }

  window.__legacyV2ExporterLoaded = true;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();

  </script>
</body>
</html>
