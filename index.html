<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ショート動画</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ショート動画">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ニュースセクション -->
    <section class="card" id="news-section">
      <div class="section-header">
        <h2>ニュース</h2>
        <div class="action-buttons">
          <button id="add-news-btn" class="btn primary">+ 追加</button>
          <button id="open-short-video-player" class="btn" title="ショート動画を再生">
            🎬 ショート動画
          </button>
        </div>
      </div>
      <div id="news-tabs" class="tab-container horizontal-scroll"></div>
      <div id="news-content" class="vertical-scroll"></div>
    </section>

    <!-- 知識セクション -->
    <section class="card" id="knowledge-section">
      <div class="section-header">
        <h2>知識</h2>
        <div class="action-buttons">
          <button id="add-knowledge-btn" class="btn primary">+ 追加</button>
          <button class="btn" title="ショート動画を再生" onclick="ShortVideoState.currentTab='knowledge'; openShortVideoPlayer();">
            🎬 ショート動画
          </button>
        </div>
      </div>
      <div id="knowledge-tabs" class="tab-container horizontal-scroll"></div>
      <div id="knowledge-content" class="vertical-scroll"></div>
    </section>
  </main>

  <!-- ショート動画プレイヤーモーダル（動的生成） -->

  <script src="app.js"></script>
</body>
</html>
